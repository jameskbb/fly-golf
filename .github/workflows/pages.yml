name: Pages

# Builds Showcase Mode (recorded MaleCNS runs replayed in the browser, no backend) and deploys it to
# https://jameskbb.github.io/fly-golf/. The Python simulation never runs here: the showcase JSON in
# apps/web/public/showcase/ is exported beforehand with `fly-golf export-showcase` and committed.
#
# One-time repository setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# See docs/GITHUB_PAGES.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm --filter @fly-golf/web lint && pnpm -r typecheck
      - name: Tests (protocol contract, showcase data, frontend)
        run: pnpm -r test
      - name: Build (showcase mode, base /fly-golf/)
        run: pnpm --filter @fly-golf/web build:showcase
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
