name: CI

# Never downloads the MaleCNS connectome: the Python tests use synthetic graphs and mocks, and the
# real-data integration tests skip themselves. GitHub Pages deploys from pages.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, tests, smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sim
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests (no connectome; integration tests auto-skip)
        run: uv run pytest -q
      - name: Backend startup smoke test
        run: uv run python -m fly_golf.smoke

  web:
    name: Web (lint, typecheck, tests, live and showcase builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @fly-golf/web lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests (protocol contract, showcase data, frontend)
        run: pnpm -r test
      - name: Build (live)
        run: pnpm --filter @fly-golf/web build
      - name: Build (showcase, as deployed to GitHub Pages)
        run: pnpm --filter @fly-golf/web build:showcase
